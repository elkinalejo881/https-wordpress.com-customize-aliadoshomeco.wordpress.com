<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183B50"><title>AsisVet Laboratorio</title>
<style>
:root{--bg:#f4f7f9;--card:#fff;--ink:#14262f;--mut:#5b6e78;--pri:#183b50;--acc:#1f7a8c;--ok:#1b7f4b;--bad:#b3261e;--warn:#9a6700;--line:#dbe3e8}
@media(prefers-color-scheme:dark){:root{--bg:#10181c;--card:#18242a;--ink:#e6eef2;--mut:#93a6b0;--pri:#7fc4d6;--acc:#4fb3c8;--ok:#5fd28f;--bad:#ff8a80;--warn:#e3b341;--line:#2a3a42}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}

input,select,textarea,button{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:42px}
input,select,textarea{width:100%}textarea{min-height:70px}
button{cursor:pointer}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}@media(prefers-color-scheme:dark){button.p{color:#0b2330}}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}

.item{cursor:pointer}.item:hover{border-color:var(--acc)}.mut{color:var(--mut);font-size:13px}.err{color:var(--bad);margin:8px 0}.ok{color:var(--ok);margin:8px 0}
.svc{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}.svc input{width:22px;min-height:22px}.svc span:nth-child(2){flex:1}
.cat{font-weight:600;color:var(--pri);margin-top:10px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}

#modal{position:fixed;inset:0;background:#000b;display:none;flex-direction:column;z-index:20}#modal.on{display:flex}
#mbar{display:flex;gap:8px;padding:8px;background:var(--card);align-items:center}#mbar span{margin-right:auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#mst{flex:1;display:grid;place-items:center;overflow:auto;color:#fff}#mst img{max-width:100%;max-height:100%}#mst iframe{width:100%;height:100%;border:0;background:#fff}
.hide{display:none!important}
</style></head><body>
<header><h1>AsisVet Laboratorio</h1><small id="who"></small><button id="out" class="hide">Salir</button></header>
<nav id="nav" class="hide"></nav><main id="main"></main>
<div id="modal"><div id="mbar"><span id="mt"></span><button id="mdl">Descargar</button><button id="mx">Cerrar ✕</button></div><div id="mst"></div></div>
<script>
const $=id=>document.getElementById(id);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==='class')e.className=v;else if(n.startsWith('on'))e[n]=v;else if(v!==false&&v!=null)e.setAttribute(n,v===true?'':v)}e.append(...k.flat().filter(x=>x!=null&&x!==false).map(x=>x instanceof Node?x:document.createTextNode(String(x))));return e};
const ST={enviada:'Enviada',recibida:'Recibida',en_proceso:'En proceso',finalizada:'Finalizada',rechazada:'Rechazada',cancelada:'Cancelada',approved:'Aprobado',pending:'Pendiente',blocked:'Bloqueado'};
const badge=s=>h('span',{class:'b s-'+s},ST[s]||s);
const cop=n=>'$ '+Number(n).toLocaleString('es-CO');

let S={token:localStorage.getItem('asv.t')||'',user:null,tab:null,timer:null,labs:[],lab:localStorage.getItem('asv.lab')||''};

async function api(url,o={}){
  const hd={...(o.json?{'Content-Type':'application/json'}:{}),...(S.token?{Authorization:'Bearer '+S.token}:{}),...(o.lab?{'X-Lab':o.lab}:{})};
  const r=await fetch(url,{method:o.method||(o.json||o.body?'POST':'GET'),headers:hd,body:o.json?JSON.stringify(o.json):o.body});
  if(r.status===401&&S.token&&!url.includes('/auth/')){logout();throw new Error('Sesión vencida')}
  if(!r.ok){let m='Error';try{m=(await r.json()).message||m}catch{}throw new Error(m)}
  return r.status===204?null:r.json();
}
const note=(el,msg,ok)=>{el.className=ok?'ok':'err';el.textContent=msg};
function logout(){localStorage.removeItem('asv.t');S.token='';S.user=null;clearInterval(S.timer);boot()}
$('out').onclick=logout;

async function boot(){
  clearInterval(S.timer);$('nav').classList.add('hide');$('out').classList.add('hide');$('who').textContent='';
  if(S.token){try{S.user=(await api('/api/me')).user}catch{S.token=''}}
  if(!S.user||!S.token)return authView();
  $('out').classList.remove('hide');$('who').textContent=S.user.name+(S.user.role==='vet'?' · '+S.user.clinicName:'');
  S.user.role==='vet'?vetApp():labApp();
}

async function authView(){

  const msg=h('div'),mode={v:'in'};
  const f={email:h('input',{type:'email',autocomplete:'username',required:true}),pw:h('input',{type:'password',autocomplete:'current-password',required:true}),
    name:h('input',{autocomplete:'name'}),clinic:h('input'),phone:h('input',{type:'tel'}),city:h('input'),
    lab:h('select',{},h('option',{value:''},'— Elegir laboratorio (opcional) —'),labs.map(l=>h('option',{value:l.id},l.name+(l.city?' · '+l.city:'')))),code:h('input',{placeholder:'Ej. ABCD-2345',autocapitalize:'characters'})};
  const reg=h('div',{class:'hide'},h('label',{},'Nombre completo'),f.name,h('label',{},'Clínica o consultorio'),f.clinic,h('div',{class:'row'},h('div',{},h('label',{},'Teléfono'),f.phone),h('div',{},h('label',{},'Ciudad'),f.city)),
    h('label',{},'Laboratorio al que desea enviar muestras'),f.lab,h('label',{},'Código de invitación (si el laboratorio se lo dio; con código queda aprobado al instante)'),f.code);
  const go=h('button',{class:'p',type:'submit'},'Ingresar');
  const tabs=h('div',{class:'bar'},h('button',{type:'button',class:'p',onclick:()=>set('in')},'Ingresar'),h('button',{type:'button',onclick:()=>set('reg')},'Soy veterinario: registrarme'));
  function set(v){mode.v=v;reg.classList.toggle('hide',v==='in');go.textContent=v==='in'?'Ingresar':'Crear cuenta';[...tabs.children].forEach((b,i)=>b.className=(i===0)===(v==='in')?'p':'');f.pw.autocomplete=v==='in'?'current-password':'new-password'}
  const form=h('form',{class:'card',onsubmit:async e=>{e.preventDefault();go.disabled=true;note(msg,'');
    try{const r=mode.v==='in'?await api('/api/auth/login',{json:{email:f.email.value,password:f.pw.value}}):await api('/api/auth/register-vet',{json:{email:f.email.value,password:f.pw.value,name:f.name.value,clinicName:f.clinic.value,phone:f.phone.value,city:f.city.value,labId:f.lab.value||undefined,code:f.code.value||undefined}});
      S.token=r.token;localStorage.setItem('asv.t',r.token);boot()}catch(x){note(msg,x.message)}go.disabled=false}},
    h('h2',{},'Bienvenido'),tabs,h('label',{},'Correo'),f.email,h('label',{},'Contraseña (mínimo 8 caracteres)'),f.pw,reg,msg,h('div',{class:'bar'},go));
  m.append(form);
}
// ---------- estructura común ----------
function tabsUI(list,start){$('nav').classList.remove('hide');$('nav').textContent='';
  const sel=t=>{S.tab=t;[...$('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));clearInterval(S.timer);list.find(x=>x[0]===t)[2]()};
  list.forEach(([t,label])=>$('nav').append(h('button',{'data-t':t,onclick:()=>sel(t)},label)));sel(start||list[0][0]);return sel}
const poll=(fn,ms=15000)=>{S.timer=setInterval(fn,ms)};
function viewer(d,lab){
  $('mt').textContent=d.filename;$('mst').textContent='Cargando…';$('modal').classList.add('on');
  const isImg=d.mime.startsWith('image/');
  api(`/api/documents/${d.id}/url?disposition=inline`+(isImg&&d.hasThumbnail?'&variant=optimized':''),{lab}).then(({url})=>{$('mst').textContent='';
    if(isImg){$('mst').append(h('img',{src:url,alt:d.filename}))}else if(d.mime==='application/pdf'){$('mst').append(h('iframe',{src:url,title:d.filename}))}
    else $('mst').textContent='Formato no visible aquí. Use «Descargar».'}).catch(e=>$('mst').textContent=e.message);
  $('mdl').onclick=async()=>{try{location.href=(await api(`/api/documents/${d.id}/url?disposition=attachment`,{lab})).url}catch(e){alert(e.message)}};
}
$('mx').onclick=()=>{$('modal').classList.remove('on');$('mst').textContent=''};addEventListener('keydown',e=>e.key==='Escape'&&$('mx').click());
function docsBlock(req,lab,box){
  const render=async()=>{try{const{items}=await api(`/api/documents?requestId=${req.id}&pageSize=50`,{lab});box.textContent='';
    if(!items.length)box.append(h('p',{class:'mut'},'Sin documentos todavía.'));
    for(const d of items)box.append(h('div',{class:'svc'},h('span',{},d.kind==='lab_result_pdf'?'📄':d.mime==='application/pdf'?'📎':'🖼️'),h('span',{},h('b',{},d.filename),h('br'),h('span',{class:'mut'},(KINDS[d.kind]||d.kind)+' · '+fdate(d.createdAt)+(d.status==='processing'?' · procesando…':d.status!=='available'?' · no disponible':''))),
      h('button',{disabled:d.status!=='available',onclick:()=>viewer(d,lab)},'Ver')))}catch(e){box.textContent=e.message}};
  render();return render;
}
function uploader(req,lab,kind,label,after,multiple=true){
  const msg=h('div'),inp=h('input',{type:'file',multiple,accept:'application/pdf,image/*',class:'hide'});
  inp.onchange=async()=>{if(!inp.files.length)return;note(msg,'Subiendo…',true);const fd=new FormData();fd.append('kind',kind);fd.append('requestId',req.id);for(const f of inp.files)fd.append('files',f,f.name);
    try{const r=await fetch('/api/documents',{method:'POST',headers:{Authorization:'Bearer '+S.token,...(lab?{'X-Lab':lab}:{})},body:fd});const j=await r.json();if(!r.ok&&!j.results)throw new Error(j.message||'Error');
      const bad=j.results.filter(x=>!x.ok);note(msg,j.results.length-bad.length+' archivo(s) enviado(s).'+(bad.length?' Rechazados: '+bad.map(b=>b.filename+' ('+b.message+')').join('; '):''),!bad.length);after()}catch(e){note(msg,e.message)}inp.value=''};
  return h('div',{},h('button',{onclick:()=>inp.click()},label),inp,msg);
}
const exportBtns=(qs)=>h('span',{},h('button',{onclick:()=>dl('csv',qs)},'⬇ CSV'),' ',h('button',{onclick:()=>dl('xlsx',qs)},'⬇ Excel'));
async function dl(fmt,qs){try{const r=await fetch(`/api/requests/export.${fmt}?${qs()}`,{headers:{Authorization:'Bearer '+S.token}});if(!r.ok)throw new Error('No se pudo exportar');
  const a=h('a',{href:URL.createObjectURL(await r.blob()),download:`solicitudes.${fmt}`});document.body.append(a);a.click();a.remove()}catch(e){alert(e.message)}}
function timeline(r){return h('div',{class:'tl'},r.events.map(e=>h('div',{},badge(e.status),' ',h('span',{class:'mut'},fdate(e.at)+' · '+e.by+(e.note?' · '+e.note:'')))))}

// ---------- VETERINARIO ----------
function vetApp(){tabsUI([['new','Nueva solicitud',vetNew],['mine','Mis solicitudes',vetList],['labs','Mis laboratorios',vetLabs]],'new')}
async function myApprovedLabs(){S.labs=(await api('/api/vet/labs')).labs;return S.labs.filter(l=>l.status==='approved')}
async function vetNew(){
  const m=$('main');m.textContent='Cargando…';let labs;try{labs=await myApprovedLabs()}catch(e){return m.textContent=e.message}
  const cfg=await api('/api/config');m.textContent='';
  if(!labs.length)return m.append(h('div',{class:'card'},h('h2',{},'Aún no tiene laboratorios aprobados'),h('p',{},'Vaya a «Mis laboratorios» para unirse con el código de invitación del laboratorio o esperar su aprobación.'),h('button',{class:'p',onclick:()=>document.querySelector('[data-t=labs]').click()},'Ir a Mis laboratorios')));
  const chosen=new Set();let services=[];
  const labSel=h('select',{},labs.map(l=>h('option',{value:l.id,selected:l.id===S.lab},l.name+(l.city?' · '+l.city:''))));
  const list=h('div'),search=h('input',{type:'search',placeholder:'Buscar examen…'}),total=h('div',{class:'tot'},'Total estimado: $ 0'),msg=h('div');

      list.append(h('label',{class:'svc',style:'margin:0;color:inherit;font-size:15px'},h('input',{type:'checkbox',checked:chosen.has(s.id),onchange:e=>{e.target.checked?chosen.add(s.id):chosen.delete(s.id);upd()}}),h('span',{},s.name,h('br'),h('span',{class:'mut'},s.code+' · muestra: '+(s.sampleType||'—')+' · entrega ~'+(s.turnaroundHours>=48?Math.round(s.turnaroundHours/24)+' días':s.turnaroundHours+' h'))),h('span',{},cop(s.price))))}};
  const load=async()=>{S.lab=labSel.value;localStorage.setItem('asv.lab',S.lab);chosen.clear();list.textContent='Cargando portafolio…';
    try{services=(await api(`/api/labs/${S.lab}/services`)).services;draw();upd()}catch(e){list.textContent=e.message}};
  labSel.onchange=load;search.oninput=draw;
  const p={name:h('input'),species:h('select',{},cfg.speciesList.map(x=>h('option',{},x))),breed:h('input'),age:h('input',{placeholder:'Ej. 4 años'}),sex:h('select',{},['','macho','hembra'].map(x=>h('option',{value:x},x||'—'))),owner:h('input')};
  const sample=h('select',{},cfg.sampleTypes.map(x=>h('option',{},x))),date=h('input',{type:'date',max:new Date().toISOString().slice(0,10)}),notes=h('textarea',{maxlength:1000,placeholder:'Signos clínicos, sospecha, medicación…'});

    try{const r=await api('/api/requests',{json:{labId:labSel.value,serviceIds:[...chosen],sampleType:sample.value,collectionDate:date.value||null,notes:notes.value,patient:{name:p.name.value,species:p.species.value,breed:p.breed.value,age:p.age.value,sex:p.sex.value,ownerName:p.owner.value}}});
      vetList(r.request.id)}catch(e){note(msg,e.message)}send.disabled=false}},'Enviar muestra al laboratorio');

    h('div',{class:'card'},h('h3',{},'2. Paciente'),h('div',{class:'row'},h('div',{},h('label',{},'Nombre *'),p.name),h('div',{},h('label',{},'Especie *'),p.species),h('div',{},h('label',{},'Raza'),p.breed),h('div',{},h('label',{},'Edad'),p.age),h('div',{},h('label',{},'Sexo'),p.sex),h('div',{},h('label',{},'Propietario'),p.owner))),
    h('div',{class:'card'},h('h3',{},'3. Muestra'),h('div',{class:'row'},h('div',{},h('label',{},'Tipo de muestra *'),sample),h('div',{},h('label',{},'Fecha de toma'),date)),h('label',{},'Observaciones'),notes,msg,h('div',{class:'bar'},send)));
  load();

async function vetList(openId){
  const m=$('main');const q={status:h('select',{},h('option',{value:''},'Todos los estados'),Object.keys(ST).slice(0,6).map(s=>h('option',{value:s},ST[s]))),text:h('input',{type:'search',placeholder:'Buscar paciente o número…'})};
  const box=h('div'),qs=()=>new URLSearchParams({status:q.status.value,q:q.text.value}).toString();

async function vetDetail(id){

      h('h3',{},'Paciente'),h('div',{},`${r.patient.name} (${r.patient.species}${r.patient.breed?', '+r.patient.breed:''}${r.patient.age?', '+r.patient.age:''}${r.patient.sex?', '+r.patient.sex:''})`),r.patient.ownerName&&h('div',{class:'mut'},'Propietario: '+r.patient.ownerName),

async function vetLabs(){
  const m=$('main');m.textContent='Cargando…';await myApprovedLabs().catch(()=>{});const all=(await api('/api/labs')).labs;m.textContent='';
  const sel=h('select',{},all.map(l=>h('option',{value:l.id},l.name+(l.city?' · '+l.city:'')))),code=h('input',{placeholder:'Código de invitación (opcional)',autocapitalize:'characters'}),msg=h('div');
